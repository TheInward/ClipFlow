<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClipFlow · AI 创作引擎 · 原型 v2</title>
<style>
  :root{
    --bg:#f6f6f7; --panel:#ffffff; --panel-2:#fbfbfc;
    --ink:#0b0b0d; --ink-2:#5f6066; --ink-3:#9b9ca3;
    --line:#e7e7ea; --line-2:#efeff2;
    --a1:#0b0b0d; --a2:#3a3a40;
    --r:20px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --shadow-sm:0 1px 2px rgba(10,10,12,.04);
    --shadow-md:0 10px 30px -12px rgba(10,10,12,.16);
    --shadow-lg:0 30px 70px -30px rgba(10,10,12,.22);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  ::selection{background:rgba(10,10,12,.12)}
  button{font-family:inherit;color:inherit}
  a{color:inherit;text-decoration:none}

  /* ---------- 背景：极淡网格 + 灰白光晕 ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
  .bg::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(10,10,12,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(10,10,12,.045) 1px,transparent 1px);
    background-size:72px 72px;mask-image:radial-gradient(80% 60% at 50% 0%,#000 20%,transparent 72%)}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 24s ease-in-out infinite alternate}
  .b1{width:560px;height:560px;left:-160px;top:-200px;background:radial-gradient(circle,#ffffff,transparent 68%)}
  .b2{width:520px;height:520px;right:-160px;top:-140px;background:radial-gradient(circle,#e9e9ee,transparent 70%);animation-delay:-8s}
  .b3{width:420px;height:420px;left:40%;top:46%;background:radial-gradient(circle,#f0f0f3,transparent 72%);opacity:.7;animation-delay:-14s}
  @keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(36px,26px,0) scale(1.1)}}
  .noise{position:absolute;inset:0;opacity:.02;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

  .wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 28px}

  /* ---------- 导航 ---------- */
  header{position:sticky;top:0;z-index:40;backdrop-filter:blur(18px) saturate(160%);
    background:rgba(246,246,247,.78);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:26px;height:66px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.02em;font-size:16px;color:var(--ink)}
  .mark{width:28px;height:28px;border-radius:9px;background:#0b0b0d;position:relative;
    box-shadow:0 6px 18px -6px rgba(10,10,12,.6)}
  .mark::after{content:"";position:absolute;inset:7px;border-radius:3px;background:#fff}
  .nav-links{display:flex;gap:2px;margin-left:6px}
  .nav-links a{font-size:13.5px;color:var(--ink-2);padding:7px 13px;border-radius:999px;transition:.18s}
  .nav-links a:hover{color:var(--ink);background:#ececed}
  .nav-links a.on{color:#fff;background:#111}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .credits{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:600;
    background:#fff;border:1px solid var(--line);color:var(--ink);cursor:pointer;transition:.18s;box-shadow:var(--shadow-sm)}
  .credits:hover{border-color:#d0d0d5;box-shadow:var(--shadow-md)}
  .credits b{font-variant-numeric:tabular-nums}
  .avatar{width:34px;height:34px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:650}

  /* ---------- Hero ---------- */
  .hero{padding:82px 0 22px;text-align:center;position:relative}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font:500 11.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-2);background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:999px;box-shadow:var(--shadow-sm)}
  .dotpulse{width:6px;height:6px;border-radius:50%;background:#111;animation:pulse 2.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  h1{font-size:clamp(38px,6vw,72px);line-height:1.04;letter-spacing:-.045em;font-weight:640;margin:26px 0 18px;color:var(--ink)}
  h1 .underline{position:relative;white-space:nowrap}
  h1 .underline::after{content:"";position:absolute;left:2px;right:2px;bottom:.07em;height:.13em;border-radius:99px;
    background:linear-gradient(90deg,#0b0b0d,#6b6b72);opacity:.9}
  .lede{max-width:620px;margin:0 auto 32px;color:var(--ink-2);font-size:16.5px}

  .cmd{position:relative;max-width:720px;margin:0 auto;padding:5px;border-radius:22px;background:#fff;
    border:1px solid var(--line);box-shadow:0 24px 60px -30px rgba(10,10,12,.24), inset 0 1px 0 #fff}
  .cmd-in{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:11px 11px 11px 20px}
  .cmd-in .spark{font-size:15px;color:#111}
  .cmd input{flex:1;background:none;border:0;outline:none;color:var(--ink);font-size:15.5px}
  .cmd input::placeholder{color:#a2a2a9}
  .go{border:0;cursor:pointer;height:42px;padding:0 20px;border-radius:13px;font-size:14px;font-weight:600;color:#fff;
    background:#111;transition:.18s;white-space:nowrap}
  .go:hover{background:#26262b;transform:translateY(-1px);box-shadow:0 12px 26px -12px rgba(10,10,12,.6)}
  .sugg{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:18px}
  .sugg span{font-size:12.5px;color:var(--ink-2);padding:7px 14px;border-radius:999px;border:1px solid var(--line);
    background:#fff;cursor:pointer;transition:.18s}
  .sugg span:hover{color:var(--ink);border-color:#cfcfd4;background:#fafafa}

  /* ---------- 计数条 ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:56px 0 0;background:var(--line);
    border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .stat{background:#fff;padding:20px 22px}
  .stat b{display:block;font-size:24px;letter-spacing:-.03em;font-weight:640;color:var(--ink)}
  .stat span{font:500 11px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

  /* ---------- 分区 ---------- */
  .sec{padding:74px 0 0}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
  .sec-head h2{font-size:clamp(22px,3vw,30px);letter-spacing:-.03em;margin:0;font-weight:620;color:var(--ink)}
  .kicker{font:500 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}

  /* ---------- Bento ---------- */
  .bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:148px;gap:12px}
  .tile{position:relative;overflow:hidden;border-radius:var(--r);padding:20px;cursor:pointer;background:#fff;
    border:1px solid var(--line);transition:.22s cubic-bezier(.2,.7,.2,1);box-shadow:var(--shadow-sm)}
  .tile::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:.22s;
    background:radial-gradient(420px 220px at 20% 0%,rgba(10,10,12,.05),transparent 62%);pointer-events:none}
  .tile:hover{transform:translateY(-3px);border-color:#d5d5da;box-shadow:var(--shadow-lg)}
  .tile:hover::after{opacity:1}
  .tile.big{grid-column:span 2;grid-row:span 2}
  .tile.wide{grid-column:span 2}
  .tile .sym{position:absolute;right:14px;top:12px;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
  .tile h3{margin:0;font-size:15.5px;letter-spacing:-.01em;font-weight:600;color:var(--ink)}
  .tile p{margin:6px 0 0;font-size:12.5px;color:var(--ink-3);max-width:34ch;line-height:1.55}
  .tile.big h3{font-size:23px;letter-spacing:-.025em}
  .tile.big p{font-size:13.5px;color:var(--ink-2)}
  .glyph{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px;font-size:15px;
    background:#f3f3f5;border:1px solid var(--line);color:#111}
  .tile .fill{position:absolute;left:20px;right:20px;bottom:18px;height:56px;border-radius:12px;
    background:linear-gradient(120deg,#f7f7f8,#efeff1);border:1px solid var(--line)}
  .tile .fill::before{content:"";position:absolute;inset:12px 40% 12px 12px;border-radius:6px;background:#fff;border:1px solid var(--line)}
  .tile .fill::after{content:"";position:absolute;right:12px;top:12px;bottom:12px;width:34%;border-radius:6px;background:#fff;border:1px solid var(--line)}
  .badge{position:absolute;top:14px;left:20px;font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
    color:#fff;background:#111;padding:5px 9px;border-radius:999px}
  .tile.big .badge{position:static;display:inline-block;margin-bottom:14px}
  .tile.big .body{position:absolute;left:22px;right:22px;bottom:88px}

  /* ---------- 工作台 ---------- */
  .work{padding:38px 0 18px}
  .crumb{display:flex;align-items:center;gap:10px;font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:20px}
  .crumb b{color:var(--ink-3);font-weight:500}
  .work-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:24px;flex-wrap:wrap}
  .work-head h1{font-size:clamp(30px,4vw,44px);margin:0;letter-spacing:-.04em;color:var(--ink)}
  .work-head p{margin:8px 0 0;color:var(--ink-2);font-size:14.5px}
  .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
  .glass{border-radius:22px;padding:22px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
  .drop{position:relative;border-radius:18px;padding:46px 22px;text-align:center;cursor:pointer;transition:.2s;
    background:#fafafb;border:1px dashed #dcdce1}
  .drop:hover{border-color:#b9b9c0;background:#f5f5f7}
  .drop .orb{width:52px;height:52px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;font-size:20px;
    background:#111;color:#fff;box-shadow:0 12px 26px -14px rgba(10,10,12,.7)}
  .drop h4{margin:0 0 6px;font-size:15px;color:var(--ink)}
  .drop span{font-size:12.5px;color:var(--ink-3)}
  .lbl{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:24px 0 10px}
  .seg{display:inline-flex;gap:4px;padding:4px;border-radius:13px;background:#f1f1f3;border:1px solid var(--line)}
  .seg button{border:0;background:none;height:32px;padding:0 15px;border-radius:10px;font-size:13px;color:var(--ink-2);cursor:pointer;transition:.18s}
  .seg button.on{background:#111;color:#fff;font-weight:600;box-shadow:0 8px 18px -10px rgba(10,10,12,.7)}
  .field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-radius:13px;
    background:#fafafb;border:1px solid var(--line);margin-top:10px;font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:.18s}
  .field b{color:var(--ink);font-weight:550}
  .field:hover{border-color:#cfcfd4;background:#f5f5f7}
  .submit-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:22px;flex-wrap:wrap}
  .cost{font:500 12px/1.5 var(--mono);color:var(--ink-3)}
  .cost b{color:var(--ink)}
  .cta{border:0;cursor:pointer;height:46px;padding:0 24px;border-radius:14px;font-size:14.5px;font-weight:650;color:#fff;
    background:#111;box-shadow:0 18px 36px -18px rgba(10,10,12,.65);transition:.18s}
  .cta:hover{background:#26262b;transform:translateY(-1px)}

  .preview{position:relative;aspect-ratio:16/10;border-radius:20px;overflow:hidden;
    background:radial-gradient(420px 260px at 50% 20%,#f0f0f3,transparent 60%),linear-gradient(160deg,#fafafb,#eeeef1);
    border:1px solid var(--line);display:grid;place-items:center;box-shadow:inset 0 0 0 1px #fff}
  .preview .scan{position:absolute;left:0;right:0;height:26%;top:-30%;
    background:linear-gradient(180deg,transparent,rgba(10,10,12,.045),transparent);animation:scan 4s ease-in-out infinite}
  @keyframes scan{0%{top:-30%}60%{top:110%}100%{top:110%}}
  .preview .ph{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#9b9ca3}
  .preview .corner{position:absolute;width:16px;height:16px;border:1.5px solid #c9c9cf}
  .c1{left:14px;top:14px;border-right:0;border-bottom:0}
  .c2{right:14px;top:14px;border-left:0;border-bottom:0}
  .c3{left:14px;bottom:14px;border-right:0;border-top:0}
  .c4{right:14px;bottom:14px;border-left:0;border-top:0}
  .preview .pillz{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:8px}
  .preview .pillz span{flex:1;height:34px;border-radius:10px;display:grid;place-items:center;font-size:11.5px;color:var(--ink-2);
    background:rgba(255,255,255,.82);border:1px solid var(--line);backdrop-filter:blur(8px)}
  .preview .play{position:absolute;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:#111;
    background:rgba(255,255,255,.9);border:1px solid var(--line);box-shadow:0 18px 44px -18px rgba(10,10,12,.4)}
  .preview::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 110%,rgba(10,10,12,.05),transparent 60%)}
  .dl{display:flex;gap:10px;margin-top:12px}
  .dl button{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13.5px;cursor:pointer;transition:.18s}
  .dl button:hover{background:#f7f7f8;border-color:#d0d0d5}
  .dl button.pri{background:#111;color:#fff;border:0;font-weight:650}
  .dl button.pri:hover{background:#26262b}

  /* 时间轴 */
  .timeline{margin-top:16px;border-radius:18px;padding:16px;background:#fafafb;border:1px solid var(--line)}
  .tl-head{display:flex;justify-content:space-between;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
  .strip{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:52px}
  .strip i{border-radius:5px;background:linear-gradient(180deg,#f0f0f2,#e8e8eb);border:1px solid var(--line);position:relative}
  .strip i:nth-child(4n){background:linear-gradient(180deg,#e6e6e9,#dcdce0)}
  .strip i:nth-child(7n){background:linear-gradient(180deg,#111,#2a2a2f);border-color:#111}
  .strip i::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:rgba(10,10,12,.22);transform:translate(-50%,-50%)}
  .strip i:nth-child(7n)::after{background:rgba(255,255,255,.75)}

  /* ---------- 任务 ---------- */
  .list{border-radius:22px;border:1px solid var(--line);overflow:hidden;background:#fff;box-shadow:var(--shadow-sm)}
  .row{display:flex;align-items:center;gap:16px;padding:18px 20px;border-top:1px solid var(--line-2);transition:.18s}
  .row:first-child{border-top:0}
  .row:hover{background:#fafafb}
  .thumb{width:54px;height:54px;border-radius:13px;flex:0 0 54px;display:grid;place-items:center;font-size:15px;color:var(--ink-2);
    background:#f3f3f5;border:1px solid var(--line)}
  .row .meta{flex:1;min-width:0}
  .row .t{font-size:14px;font-weight:550;letter-spacing:-.01em;color:var(--ink)}
  .row .s{font-size:12px;color:var(--ink-3);margin-top:2px}
  .prog{height:5px;border-radius:99px;background:#ececef;margin-top:9px;max-width:260px;overflow:hidden}
  .prog i{display:block;height:100%;border-radius:99px;background:#111}
  .st{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;border-radius:999px}
  .st.done{color:var(--ink-2);background:#f3f3f5;border:1px solid var(--line)}
  .st.run{color:#fff;background:#111;border:1px solid #111}
  .st.idle{color:var(--ink-3);background:#fafafb;border:1px solid var(--line)}
  .ghost-btn{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;transition:.18s;color:var(--ink)}
  .ghost-btn:hover{background:#f7f7f8;border-color:#d0d0d5}

  /* ---------- 套餐 ---------- */
  .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
  .plan{position:relative;padding:26px;border-radius:22px;border:1px solid var(--line);background:#fff;transition:.22s;box-shadow:var(--shadow-sm)}
  .plan:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#d5d5da}
  .plan.hot{background:#0b0b0d;border-color:#0b0b0d;color:#fff;box-shadow:0 30px 70px -30px rgba(10,10,12,.55)}
  .plan .tag{position:absolute;top:-11px;left:26px;font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
    background:#111;color:#fff;padding:5px 10px;border-radius:999px;border:1px solid #2a2a2f}
  .plan h3{margin:0;font-size:14px;font-weight:600;color:var(--ink-2)}
  .plan.hot h3{color:#a9a9b2}
  .plan .p{font-size:38px;letter-spacing:-.045em;font-weight:640;margin:12px 0 2px;color:var(--ink)}
  .plan.hot .p{color:#fff}
  .plan .p small{font-size:13px;color:var(--ink-3);font-weight:500;letter-spacing:0}
  .plan.hot .p small{color:#a9a9b2}
  .plan ul{list-style:none;padding:0;margin:18px 0 22px;font-size:13px;color:var(--ink-2)}
  .plan.hot ul{color:#c9c9d1}
  .plan li{display:flex;gap:9px;padding:5px 0}
  .plan li::before{content:"—";color:var(--ink-3)}
  .plan.hot li::before{color:#6f6f79}
  .plan button{width:100%;height:42px;border-radius:12px;font-size:13.5px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);background:#fff;transition:.18s;color:var(--ink)}
  .plan button:hover{background:#f5f5f7}
  .plan.hot button{background:#fff;color:#0b0b0d;border:0}
  .plan.hot button:hover{background:#ececef}
  .pack{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
  .pack div{flex:1;min-width:180px;padding:18px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.18s;box-shadow:var(--shadow-sm)}
  .pack div:hover{border-color:#d0d0d5;transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .pack b{font-size:19px;letter-spacing:-.02em;color:var(--ink)}
  .pack span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}

  footer{margin-top:84px;padding:32px 0 44px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  .toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,10px);opacity:0;pointer-events:none;
    padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;transition:.3s;background:#111;color:#fff;
    box-shadow:0 20px 50px -20px rgba(10,10,12,.7)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:980px){
    .bento{grid-template-columns:repeat(2,1fr)}
    .tile.big,.tile.wide{grid-column:span 2;grid-row:auto}
    .tile.big{min-height:190px}
    .grid2{grid-template-columns:1fr}
    .plans{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    .nav-links{display:none}
  }

  /* ---------- 创作台 (Text→Image / Text→Video / Image→Video / Ref→Video) ---------- */
  .studio{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start;margin-top:6px}
  .prompt-card{border-radius:22px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-sm);overflow:hidden}
  .prompt-top{padding:20px 22px 14px}
  .prompt-top .tip{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
  textarea.big{width:100%;min-height:96px;resize:vertical;border:0;outline:none;background:transparent;color:var(--ink);
    font-family:inherit;font-size:16px;line-height:1.6}
  textarea.big::placeholder{color:#a8a8af}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 22px 14px}

function tile(n, size = ''){

      <div class="glyph">${t.g}</div>

}

/* 结构参考：即梦（Dreamina）生成输入框 —— 一个卡片内完成全部输入
 *   左：＋参考内容上传位（最多 12 个）   右：大段 Prompt（支持 @ 引用素材）
 *   底栏：功能类型 ▾ / 模型 ▾ / 参考模式 / 比例·分辨率 / 数量 / 时长 / @ / 消耗 / 提交
 * 我们把深色输入框转为灰白黑语言。
 */
let genTab = 'image';
function studio(){
  setNav('n-studio');
  app.innerHTML = `
  <section class="sec" style="padding-top:44px">
    <div class="kicker">Studio</div>
    <div class="sec-head" style="margin-bottom:20px">
      <div><h2>创作台</h2><p class="lede" style="margin:6px 0 0;font-size:14px">上传参考素材 + 写一句描述，直接生成图片或视频。</p></div>
    </div>
    <div id="gwrap"></div>
  </section>${footer()}`;
  renderStudio();
}

let genParams = { ratio:null, count:'2', quality:'2K', duration:'5s', res:'1080P' };
let openMenu = null;
function renderStudio(){
  const isImg = genTab === 'image';
  const cost = isImg ? '8 积分/张' : '70 积分/条';
  const ph = isImg
    ? '上传参考图、输入文字或 @ 主体，描述你想生成的图片。'
    : '上传最多 12 个参考素材、输入文字或 @ 参考内容，自由组合图、文、音、视频多元素。例如：@图片1 模仿 @视频1 的动作。';
  const ratio = genParams.ratio || (isImg ? '智能比例' : '9:16');
  const menus = {
    ratio:  isImg ? ['智能比例','1:1','16:9','9:16','4:3'] : ['9:16','16:9','1:1','4:3'],
    size:   isImg ? ['2K','4K'] : ['1080P','2K'],
    count:  isImg ? ['1 张','2 张','4 张'] : ['1 个','2 个'],
    duration: ['5s','10s','15s'],
  };
  const menuRow = openMenu ? `
    <div class="menu-row">
      <span class="menu-lbl">${({ratio:'比例',size:isImg?'清晰度':'分辨率',count:'数量',duration:'时长'})[openMenu]}</span>
      ${menus[openMenu].map(v=>{
        const active = openMenu==='duration' ? v===genParams.duration
          : openMenu==='count' ? v===genParams.count+' '+(isImg?'张':'个')
          : openMenu==='ratio' ? v===ratio
          : v===(isImg?genParams.quality:genParams.res);
        return `<span class="cchip ${active?'on':''}" onclick="pick('${openMenu}','${v}')">${v}</span>`;
      }).join('')}
      <span class="menu-close" onclick="openMenu=null;renderStudio()">收起 ×</span>
    </div>` : '';
  document.getElementById('gwrap').innerHTML = `
  <div class="composer">
    <div class="cp-body">
      <div class="ref-tile">
        <span class="plus">＋</span>
        <span class="ref-cap">参考内容</span>
        <span class="ref-limit">最多 12 个</span>
      </div>
      <div class="cp-text">
        <textarea placeholder="${ph}" rows="3"></textarea>
      </div>
    </div>
    ${menuRow}
    <div class="cp-bar">
      <button class="cchip mode" onclick="genTab='${isImg?'video':'image'}';openMenu=null;renderStudio()">
        ${isImg?'▣ 图片生成':'▷ 视频生成'} <span class="cv">▾</span>
      </button>
      <button class="cchip">◆ ${isImg?'Seedream 4.0':'Seedance 2.5'} <span class="cv">▾</span></button>
      <button class="cchip ${openMenu==='ratio'?'open':''}" onclick="openMenu=openMenu==='ratio'?null:'ratio';renderStudio()">⧉ ${ratio} <span class="cv">▾</span></button>
      <button class="cchip ${openMenu==='size'?'open':''}" onclick="openMenu=openMenu==='size'?null:'size';renderStudio()">◱ ${isImg?genParams.quality:genParams.res} <span class="cv">▾</span></button>
      <button class="cchip ${openMenu==='count'?'open':''}" onclick="openMenu=openMenu==='count'?null:'count';renderStudio()">▢ ${genParams.count} ${isImg?'张':'个'} <span class="cv">▾</span></button>
      ${isImg?'':`<button class="cchip ${openMenu==='duration'?'open':''}" onclick="openMenu=openMenu==='duration'?null:'duration';renderStudio()">◷ ${genParams.duration} <span class="cv">▾</span></button>`}
      <button class="cchip at">@</button>
      <div class="cp-right">
        <span class="cost">✦ ${cost}</span>
        <span class="left-credits">剩余 1,280</span>
        <button class="send" onclick="toast('已提交生成（原型演示）')">↑</button>
      </div>
    </div>
  </div>

  <div class="sec-head" style="margin:44px 0 14px"><div><h3 style="margin:0;font-size:16px;letter-spacing:-.02em">最近生成</h3></div>
    <span onclick="screen('tasks')" style="cursor:pointer;font-size:12.5px;color:var(--ink-3)">全部 ›</span></div>
  <div class="gallery">
    ${(isImg
      ? [['product-hero-01.png','Seedream 4.0'],['style-frame-02.png','FLUX 1.1'],['poster-03.png','Seedream 4.0'],['thumb-04.png','Seedream Edit']]
      : [['reel-01.mp4','Seedance 2.5'],['action-02.mp4','可灵 2.1'],['broll-03.mp4','Seedance Pro'],['ref-04.mp4','Veo 3']]
    ).map(([n,m])=>`
      <div class="shot ${isImg?'':'video'}">
        <div class="ph">${isImg?'IMG':'▶'}</div>
        <div class="cap"><b>${n}</b><span class="tagx">${m}</span></div>
      </div>`).join('')}
  </div>`;
}
function pick(menu, v){
  if (menu==='ratio') genParams.ratio = v;
  if (menu==='size') { if (genTab==='image') genParams.quality = v; else genParams.res = v; }
  if (menu==='count') genParams.count = v.replace(/[^0-9]/g,'');
  if (menu==='duration') genParams.duration = v;
  openMenu = null; renderStudio();
}

  setNav('n-studio');

        </div>`).join('')}
    </div>
  </section>${footer()}`;
