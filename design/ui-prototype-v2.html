<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClipFlow · AI 创作引擎 · 原型 v2</title>
<style>
  :root{
    --bg:#08090c; --bg-2:#0b0d12; --panel:rgba(255,255,255,.045); --panel-2:rgba(255,255,255,.07);
    --ink:#f4f6fb; --ink-2:#a7b0c0; --ink-3:#6c7688;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.055);
    --a1:#6d5efc; --a2:#22d3ee; --a3:#f472b6;
    --ok:#34d399; --warn:#fbbf24;
    --r:20px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  ::selection{background:rgba(109,94,252,.4)}
  button{font-family:inherit;color:inherit}
  a{color:inherit;text-decoration:none}

  /* ---------- 背景：网格 + 光斑 + 噪点 ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bg::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:72px 72px;
    mask-image:radial-gradient(70% 55% at 50% 0%,#000 30%,transparent 78%)}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
  .b1{width:620px;height:620px;left:-160px;top:-180px;background:radial-gradient(circle,#5b4bff,transparent 65%)}
  .b2{width:560px;height:560px;right:-140px;top:-120px;background:radial-gradient(circle,#0891b2,transparent 65%);animation-delay:-6s}
  .b3{width:520px;height:520px;left:38%;top:44%;background:radial-gradient(circle,#be185d,transparent 68%);opacity:.22;animation-delay:-12s}
  @keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(40px,30px,0) scale(1.12)}}
  .noise{position:absolute;inset:0;opacity:.035;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

  .wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 28px}

  /* ---------- 导航 ---------- */
  header{position:sticky;top:0;z-index:40;backdrop-filter:blur(18px) saturate(160%);
    background:linear-gradient(180deg,rgba(8,9,12,.86),rgba(8,9,12,.55));border-bottom:1px solid var(--line-2)}
  .nav{display:flex;align-items:center;gap:26px;height:68px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.02em;font-size:16px}
  .mark{width:30px;height:30px;border-radius:10px;position:relative;
    background:conic-gradient(from 140deg,var(--a1),var(--a2),var(--a3),var(--a1));
    box-shadow:0 0 0 1px rgba(255,255,255,.14), 0 6px 22px rgba(109,94,252,.45)}
  .mark::after{content:"";position:absolute;inset:7px;border-radius:4px;background:#08090c}
  .nav-links{display:flex;gap:4px;margin-left:8px}
  .nav-links a{font-size:13.5px;color:var(--ink-2);padding:7px 13px;border-radius:999px;transition:.2s}
  .nav-links a:hover{color:var(--ink);background:rgba(255,255,255,.06)}
  .nav-links a.on{color:var(--ink);background:rgba(255,255,255,.09)}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .credits{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:600;
    background:linear-gradient(120deg,rgba(109,94,252,.22),rgba(34,211,238,.16));border:1px solid rgba(140,130,255,.35);
    color:#dfe3ff;cursor:pointer;transition:.2s}
  .credits:hover{border-color:rgba(160,150,255,.6);box-shadow:0 0 24px rgba(109,94,252,.35)}
  .credits b{font-variant-numeric:tabular-nums}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3f3a6d,#1b2740);
    border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;font-size:12.5px;font-weight:650;color:#cfd6ff}

  /* ---------- Hero ---------- */
  .hero{padding:84px 0 26px;text-align:center;position:relative}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font:500 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
    color:#b9c2ff;background:rgba(109,94,252,.12);border:1px solid rgba(140,130,255,.28);padding:8px 14px;border-radius:999px}
  .dotpulse{width:6px;height:6px;border-radius:50%;background:var(--a2);box-shadow:0 0 12px var(--a2);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  h1{font-size:clamp(38px,6.2vw,74px);line-height:1.02;letter-spacing:-.045em;font-weight:640;margin:26px 0 18px}
  h1 .underline{position:relative;white-space:nowrap}
  h1 .underline::after{content:"";position:absolute;left:2px;right:2px;bottom:.06em;height:.14em;border-radius:99px;
    background:linear-gradient(90deg,var(--a1),var(--a2));opacity:.9;box-shadow:0 0 26px rgba(109,94,252,.85)}
  .lede{max-width:620px;margin:0 auto 34px;color:var(--ink-2);font-size:16.5px}

  .cmd{position:relative;max-width:720px;margin:0 auto;padding:6px;border-radius:22px;
    background:linear-gradient(140deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 40%,rgba(255,255,255,.08));
    box-shadow:0 30px 80px -30px rgba(109,94,252,.65), inset 0 0 0 1px rgba(255,255,255,.06)}
  .cmd-in{display:flex;align-items:center;gap:14px;background:rgba(10,11,16,.86);border-radius:18px;padding:12px 12px 12px 20px;backdrop-filter:blur(10px)}
  .cmd-in .spark{font-size:16px;background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .cmd input{flex:1;background:none;border:0;outline:none;color:var(--ink);font-size:15.5px}
  .cmd input::placeholder{color:#6d7688}
  .go{border:0;cursor:pointer;height:42px;padding:0 20px;border-radius:13px;font-size:14px;font-weight:600;color:#0a0b10;
    background:linear-gradient(120deg,#cfd3ff,#8ee9ff);transition:.2s;white-space:nowrap}
  .go:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .sugg{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:20px}
  .sugg span{font-size:12.5px;color:var(--ink-2);padding:7px 14px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);cursor:pointer;transition:.2s}
  .sugg span:hover{color:var(--ink);border-color:rgba(140,130,255,.5);background:rgba(109,94,252,.12)}

  /* ---------- 计数条 ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:56px 0 0;background:var(--line-2);border:1px solid var(--line-2);border-radius:16px;overflow:hidden}
  .stat{background:rgba(10,11,16,.6);padding:20px 22px}
  .stat b{display:block;font-size:24px;letter-spacing:-.03em;font-weight:640}
  .stat span{font:500 11px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

  /* ---------- 分区 ---------- */
  .sec{padding:78px 0 0}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}
  .sec-head h2{font-size:clamp(22px,3vw,30px);letter-spacing:-.03em;margin:0;font-weight:620}
  .kicker{font:500 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#8b93ff;margin-bottom:12px}

  /* ---------- Bento ---------- */
  .bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:148px;gap:14px}
  .tile{position:relative;overflow:hidden;border-radius:var(--r);padding:20px;cursor:pointer;
    background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
    border:1px solid var(--line);transition:.25s cubic-bezier(.2,.7,.2,1)}
  .tile::after{content:"";position:absolute;inset:-1px;border-radius:inherit;opacity:0;transition:.25s;
    background:radial-gradient(420px 220px at 20% 0%,rgba(109,94,252,.28),transparent 60%);pointer-events:none}
  .tile:hover{transform:translateY(-4px);border-color:rgba(160,150,255,.42);box-shadow:0 26px 60px -28px rgba(109,94,252,.7)}
  .tile:hover::after{opacity:1}
  .tile.big{grid-column:span 2;grid-row:span 2}
  .tile.wide{grid-column:span 2}
  .tile .sym{position:absolute;right:14px;top:12px;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
  .tile h3{margin:0;font-size:15.5px;letter-spacing:-.01em;font-weight:600}
  .tile p{margin:6px 0 0;font-size:12.5px;color:var(--ink-3);max-width:34ch;line-height:1.55}
  .tile.big h3{font-size:22px;letter-spacing:-.02em}
  .tile.big p{font-size:13.5px;color:var(--ink-2)}
  .glyph{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px;font-size:15px;
    background:linear-gradient(150deg,rgba(109,94,252,.3),rgba(34,211,238,.16));border:1px solid rgba(255,255,255,.12);color:#dfe4ff}
  .tile .fill{position:absolute;left:20px;right:20px;bottom:18px;height:56px;border-radius:12px;
    background:linear-gradient(120deg,rgba(109,94,252,.22),rgba(34,211,238,.12));border:1px solid rgba(255,255,255,.08)}
  .tile .fill::before{content:"";position:absolute;inset:12px 40% 12px 12px;border-radius:6px;background:rgba(255,255,255,.14)}
  .tile .fill::after{content:"";position:absolute;right:12px;top:12px;bottom:12px;width:34%;border-radius:6px;background:rgba(255,255,255,.06)}
  .badge{position:absolute;top:14px;left:20px;font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
    color:#bff3ff;background:rgba(34,211,238,.14);border:1px solid rgba(34,211,238,.35);padding:5px 9px;border-radius:999px}
  .tile.big .badge{position:static;display:inline-block;margin-bottom:14px}
  .tile.big .body{position:absolute;left:22px;right:22px;bottom:88px}

  /* ---------- 工作台 ---------- */
  .work{padding:40px 0 20px}
  .crumb{display:flex;align-items:center;gap:10px;font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:22px}
  .crumb b{color:var(--ink-2);font-weight:500}
  .work-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px;flex-wrap:wrap}
  .work-head h1{font-size:clamp(30px,4vw,44px);margin:0;letter-spacing:-.04em}
  .work-head p{margin:8px 0 0;color:var(--ink-2);font-size:14.5px}
  .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
  .glass{border-radius:22px;padding:22px;background:linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    border:1px solid var(--line);backdrop-filter:blur(14px)}
  .drop{position:relative;border-radius:18px;padding:46px 22px;text-align:center;cursor:pointer;transition:.25s;
    background:radial-gradient(400px 200px at 50% 0%,rgba(109,94,252,.16),transparent 70%),rgba(255,255,255,.02);
    border:1px dashed rgba(255,255,255,.18)}
  .drop:hover{border-color:rgba(160,150,255,.6);background:radial-gradient(400px 220px at 50% 10%,rgba(109,94,252,.26),transparent 70%),rgba(255,255,255,.03)}
  .drop .orb{width:52px;height:52px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(150deg,rgba(109,94,252,.4),rgba(34,211,238,.24));border:1px solid rgba(255,255,255,.16);
    box-shadow:0 10px 34px rgba(109,94,252,.35)}
  .drop h4{margin:0 0 6px;font-size:15px}
  .drop span{font-size:12.5px;color:var(--ink-3)}
  .lbl{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:24px 0 10px}
  .seg{display:inline-flex;gap:4px;padding:4px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid var(--line-2)}
  .seg button{border:0;background:none;height:32px;padding:0 15px;border-radius:10px;font-size:13px;color:var(--ink-2);cursor:pointer;transition:.2s}
  .seg button.on{background:linear-gradient(120deg,rgba(109,94,252,.5),rgba(34,211,238,.32));color:#fff;font-weight:600;box-shadow:0 6px 18px -6px rgba(109,94,252,.8)}
  .field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-radius:13px;
    background:rgba(255,255,255,.035);border:1px solid var(--line-2);margin-top:10px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
  .field b{color:var(--ink);font-weight:550}
  .field:hover{border-color:rgba(160,150,255,.35)}
  .submit-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:22px;flex-wrap:wrap}
  .cost{font:500 12px/1.5 var(--mono);color:var(--ink-3)}
  .cost b{color:#c8ffef}
  .cta{border:0;cursor:pointer;height:46px;padding:0 24px;border-radius:14px;font-size:14.5px;font-weight:650;color:#08090c;
    background:linear-gradient(120deg,#cfd3ff,#8ee9ff);box-shadow:0 16px 40px -14px rgba(120,200,255,.7);transition:.2s}
  .cta:hover{transform:translateY(-1px);filter:brightness(1.06)}

  .preview{position:relative;aspect-ratio:16/10;border-radius:20px;overflow:hidden;
    background:radial-gradient(340px 240px at 50% 28%,rgba(109,94,252,.35),transparent 62%),linear-gradient(160deg,#141726,#080a10);
    border:1px solid var(--line);display:grid;place-items:center}
  .preview .scan{position:absolute;left:0;right:0;height:26%;top:-30%;
    background:linear-gradient(180deg,transparent,rgba(140,220,255,.14),transparent);animation:scan 3.6s ease-in-out infinite}
  @keyframes scan{0%{top:-30%}60%{top:110%}100%{top:110%}}
  .preview .ph{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#7d8798}
  .preview .play{position:absolute;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#e8ecff;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);
    box-shadow:0 18px 50px -12px rgba(109,94,252,.8)}
  .preview::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 110%,rgba(8,9,12,.75),transparent 60%)}
  .preview .corner{position:absolute;width:16px;height:16px;border:1.5px solid rgba(160,220,255,.5)}
  .c1{left:14px;top:14px;border-right:0;border-bottom:0}
  .c2{right:14px;top:14px;border-left:0;border-bottom:0}
  .c3{left:14px;bottom:14px;border-right:0;border-top:0}
  .c4{right:14px;bottom:14px;border-left:0;border-top:0}
  .preview .pillz{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:8px}
  .preview .pillz span{flex:1;height:34px;border-radius:10px;display:grid;place-items:center;font-size:11.5px;color:#cfd6e6;
    background:rgba(10,12,18,.6);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(8px)}
  .dl{display:flex;gap:10px;margin-top:12px}
  .dl button{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:13.5px;cursor:pointer;transition:.2s}
  .dl button:hover{background:rgba(255,255,255,.09)}
  .dl button.pri{background:linear-gradient(120deg,#cfd3ff,#8ee9ff);color:#08090c;border:0;font-weight:650}

  /* 时间轴 */
  .timeline{margin-top:16px;border-radius:18px;padding:16px;background:rgba(255,255,255,.035);border:1px solid var(--line-2)}
  .tl-head{display:flex;justify-content:space-between;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
  .strip{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:52px}
  .strip i{border-radius:5px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));position:relative}
  .strip i:nth-child(4n){background:linear-gradient(180deg,rgba(109,94,252,.45),rgba(109,94,252,.15))}
  .strip i:nth-child(7n){background:linear-gradient(180deg,rgba(34,211,238,.4),rgba(34,211,238,.12))}
  .strip i::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transform:translate(-50%,-50%)}

  /* ---------- 任务 ---------- */
  .list{border-radius:22px;border:1px solid var(--line);overflow:hidden;background:rgba(255,255,255,.025)}
  .row{display:flex;align-items:center;gap:16px;padding:18px 20px;border-top:1px solid var(--line-2);transition:.2s}
  .row:first-child{border-top:0}
  .row:hover{background:rgba(255,255,255,.035)}
  .thumb{width:54px;height:54px;border-radius:13px;flex:0 0 54px;display:grid;place-items:center;font-size:15px;color:#cfd6ff;
    background:linear-gradient(150deg,rgba(109,94,252,.35),rgba(34,211,238,.15));border:1px solid rgba(255,255,255,.1)}
  .row .meta{flex:1;min-width:0}
  .row .t{font-size:14px;font-weight:550;letter-spacing:-.01em}
  .row .s{font-size:12px;color:var(--ink-3);margin-top:2px}
  .prog{height:5px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:9px;max-width:260px;overflow:hidden}
  .prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:0 0 14px rgba(109,94,252,.8)}
  .st{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;border-radius:999px}
  .st.done{color:#8ff0c9;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3)}
  .st.run{color:#a9d6ff;background:rgba(109,94,252,.16);border:1px solid rgba(140,130,255,.4)}
  .st.idle{color:var(--ink-2);background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .ghost-btn{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12.5px;cursor:pointer;transition:.2s}
  .ghost-btn:hover{background:rgba(255,255,255,.09);border-color:rgba(160,150,255,.4)}

  /* ---------- 套餐 ---------- */
  .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px}
  .plan{position:relative;padding:26px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:.25s}
  .plan:hover{transform:translateY(-3px);border-color:rgba(160,150,255,.35)}
  .plan.hot{background:linear-gradient(165deg,rgba(109,94,252,.22),rgba(34,211,238,.08));border-color:rgba(140,130,255,.5);
    box-shadow:0 30px 70px -30px rgba(109,94,252,.75)}
  .plan .tag{position:absolute;top:-11px;left:26px;font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
    background:linear-gradient(120deg,#cfd3ff,#8ee9ff);color:#08090c;padding:5px 10px;border-radius:999px}
  .plan h3{margin:0;font-size:14px;font-weight:600;color:var(--ink-2)}
  .plan .p{font-size:38px;letter-spacing:-.045em;font-weight:640;margin:12px 0 2px}
  .plan .p small{font-size:13px;color:var(--ink-3);font-weight:500;letter-spacing:0}
  .plan ul{list-style:none;padding:0;margin:18px 0 22px;font-size:13px;color:var(--ink-2)}
  .plan li{display:flex;gap:9px;padding:5px 0}
  .plan li::before{content:"—";color:#8b93ff}
  .plan button{width:100%;height:42px;border-radius:12px;font-size:13.5px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.05);transition:.2s}
  .plan.hot button{background:linear-gradient(120deg,#cfd3ff,#8ee9ff);color:#08090c;border:0}
  .pack{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
  .pack div{flex:1;min-width:180px;padding:18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;transition:.2s}
  .pack div:hover{border-color:rgba(160,150,255,.45);transform:translateY(-2px)}
  .pack b{font-size:19px;letter-spacing:-.02em}
  .pack span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}

  footer{margin-top:90px;padding:34px 0 46px;border-top:1px solid var(--line-2);color:var(--ink-3);font-size:12.5px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  .toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,10px);opacity:0;pointer-events:none;

function tile(n, size = ''){
  const t = TOOLS[n];
  const badge = t.badge ? `<span class="badge">${t.badge}</span>` : '';
  if (size === 'big') return `
    <div class="tile big" onclick="tool('${n}')">
      ${badge}

        <h3>${n}</h3>
        <p>${t.d}</p>
      </div>
      <div class="fill" style="height:74px;bottom:20px"></div>
    </div>`;
  return `
    <div class="tile ${size}" onclick="tool('${n}')">
      <div class="glyph">${t.g}</div>
      <h3>${n}</h3>
      <p>${t.d}</p>
    </div>`;
}

function setNav(id){ document.querySelectorAll('.nav-links a').forEach(a=>a.classList.toggle('on', Boolean(id) && a.id===id)); }
